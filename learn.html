<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn Accents - AccentX</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary-color: #1a1a2e;
    --secondary-color: #e94560;
    --bg-item: #f7f7f7;
    --hover-color: #16213e;
}
body {
    font-family: 'Roboto', sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 20px;
}
h1 {
    text-align: center;
    color: var(--primary-color);
    margin-bottom: 40px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: auto;
}
.item {
    background: var(--bg-item);
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    transition: transform 0.2s, box-shadow 0.2s;
}
.item:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 20px rgba(0,0,0,0.2);
}
.item b { display: block; font-size: 1.2rem; margin-bottom: 5px; color: var(--secondary-color);}
.item small { display: block; margin-bottom: 15px; color: #333;}
audio { width: 100%; outline: none; }

.back-btn {
    display: block;
    margin: 40px auto;
    padding: 15px 30px;
    background: var(--secondary-color);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    transition: transform 0.2s;
}
.back-btn:hover { transform: scale(1.05); background: var(--hover-color);}
</style>
</head>
<body>
<h1>Learn Accents in CMUQ</h1>

<div class="grid">
    <div class="item">
        <b>Male Nepali Speaker</b>
        <small>Calm tone, medium pace</small>
        <audio controls>
            <source src="audio1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="item">
        <b>Female Arabic Speaker</b>
        <small>Soft, slightly fast</small>
        <audio controls>
            <source src="audio1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="item">
        <b>Male Spanish Speaker</b>
        <small>Energetic tone</small>
        <audio controls>
            <source src="audio1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="item">
        <b>Male African Speaker</b>
        <small>Slow and deep voice</small>
        <audio controls>
            <source src="audio1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="item">
        <b>Female Chinese Speaker</b>
        <small>Medium pace, clear pronunciation</small>
        <audio controls>
            <source src="audio1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Add more speakers as needed -->
</div>

<a class="back-btn" href="index.html">Back to Home</a>
</body>
</html>
